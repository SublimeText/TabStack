[project]
name = "tab-stack"
version = "0.1.0"
description = "Per-window MRU tab stack for Sublime Text"
requires-python = ">=3.8"

[dependency-groups]
dev = [
  "basedpyright",
  "ruff",
  "sublime-text-stubs==1.4200.0b1",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP045"]

[tool.basedpyright]
pythonVersion = "3.8"
typeCheckingMode = "all"
# sublime-text-stubs is a stub-only distribution; the modules it describes
# only exist inside Sublime Text's plugin host.
reportMissingModuleSource = false
# `typing.override` requires 3.12 and the plugin host provides no
# typing_extensions, so the decorator cannot be used at runtime.
reportImplicitOverride = false
