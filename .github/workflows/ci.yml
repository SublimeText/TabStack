name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --group dev --no-install-project
      - run: uv run ruff check .
      - run: uv run basedpyright

  keystate-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - run: sudo modprobe uinput
      - run: mkdir -p build
      - run: cc -std=c11 -O2 -Wall -Wextra -Werror -o build/tabstack-keystate keystate/tabstack-keystate.c
      - run: sudo python3 -I tests/keystate_smoke.py --helper build/tabstack-keystate --user "$USER"
